name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        run: gradle --version

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Find Android Build Tools
        id: buildtools
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          echo "path=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/safeviewkids.jks" \
            -storetype PKCS12 \
            -alias safeviewkids \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SafeViewKids123! \
            -keypass SafeViewKids123! \
            -dname "CN=SafeView Kids, O=SafeView Kids, C=IN"

      - name: Align APK
        run: |
          "${{ steps.buildtools.outputs.path }}/zipalign" \
            -p \
            -f \
            4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/SafeViewKids-aligned.apk"

      - name: Sign APK
        run: |
          "${{ steps.buildtools.outputs.path }}/apksigner" sign \
            --ks "$RUNNER_TEMP/safeviewkids.jks" \
            --ks-key-alias safeviewkids \
            --ks-pass pass:SafeViewKids123! \
            --key-pass pass:SafeViewKids123! \
            --out "$RUNNER_TEMP/SafeViewKids-release.apk" \
            "$RUNNER_TEMP/SafeViewKids-aligned.apk"

      - name: Verify APK signature
        run: |
          "${{ steps.buildtools.outputs.path }}/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/SafeViewKids-release.apk"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeViewKids-signed-release-apk
          path: ${{ runner.temp }}/SafeViewKids-release.apk
          if-no-files-found: error
